name: Hello world workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
    hello:
      runs-on: ubuntu-latest 
      steps:
        - name: say hello
          run: echo "Hello from my first pipeline"

    goodbye:
      runs-on: ubuntu-latest
      needs: hello
      steps:
        - name: say goodbye
          run : echo "Goodbye from my first pipeline"